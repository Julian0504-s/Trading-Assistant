[project]
name = "trading-assistant"
version = "0.1.0"
description = "Persönlicher Krypto Trading Assistant für Bitunix Futures (Phase 1: Markt & Signale)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pandas>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitunix", "src/data", "src/indicators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
